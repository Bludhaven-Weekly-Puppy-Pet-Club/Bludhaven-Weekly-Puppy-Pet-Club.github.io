 */
@layer base, mobile;

@layer mobile {
  @media (max-width: 768px) {
    .pad {
      --margin-width: var(--margin-width-mobile);
      grid-template-columns: minmax(0, 1fr);
      padding-left: var(--margin-width);
    }

      padding-left: var(--space-2);
      padding-right: var(--space-2);
    }

    /* 좌측 여백 메뉴 → 왼쪽에서 밀려 나오는 드로어 */
    .side-menu {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      align-self: normal;
      z-index: 30;
      width: min(var(--drawer-width), 85vw);
      max-height: none;
      background-color: var(--color-paper);
      background-image: linear-gradient(
        to bottom,
        transparent calc(var(--line-height-rule) - 1px),
        var(--color-rule) calc(var(--line-height-rule) - 1px)
      );
      background-size: 100% var(--line-height-rule);
      background-position: 0 var(--rule-offset);
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.2);
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      visibility: hidden;
    }

    .side-menu.is-open,
    .side-menu.is-dragging {
      visibility: visible;
    }

    .side-menu.is-open {
      transform: translateX(0);
    }

    .side-menu.is-dragging {
      transition: none;
    }

    .drawer-backdrop {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: var(--color-backdrop);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .drawer-backdrop.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-backdrop.is-dragging {
      transition: none;
    }

    /* 드로어가 열린 동안 배경 스크롤 잠금 */
    html.drawer-locked,
    html.drawer-locked body {
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* 에디터 미리보기: 화면 전체, 안쪽 여백은 모바일 글 화면과 같게 */
    .pe-preview {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
    }

    .pe-preview-page {
      padding-left: calc(var(--margin-width-mobile) + var(--space-2));
      padding-right: var(--space-2);
    }

    /* 글목록 작성자: 좁은 화면에서는 닉네임만 */
    .post-list .author-avatar {
      display: none;
    }

    .member-header-avatar {
      width: calc(var(--line-height-rule) * 2);
      height: calc(var(--line-height-rule) * 2);
    }

    /* 스티커: 모바일에서는 레이어와 스티커 모드를 모두 숨긴다. */
    .sticker-layer,
    .sticker-toolbar,
    .sticker-mode-button {
      display: none !important;
    }
  }
}
